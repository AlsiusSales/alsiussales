<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Ítem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <ul>
            <li>
                <a href="">
                    <img id="logoalsius" src="thumbs/logo AS.png" alt="">
                </a>
            </li>
        </ul>
    </nav>
    <div id="header">
        <h2>¿Que quieres vender?</h2>
    </div>
    <div id="item-creator">
        <!-- Select Item -->
        <select id="itemSelector">
            <option value="espada-caballero-elite">Espada de caballero elite</option>
            <option value="lanza-caballero-elite">Lanza de caballero elite</option>
            <option value="hacha-caballero-elite">Hacha de caballero elite</option>
            <option value="martillo-caballero-elite">Martillo de caballero elite</option>
        </select>
        <div id="item-creator-container">
            <!-- Item Template -->
            <div id="item-creator-template">
                <div id="item-template"></div>
            </div>

            <!-- Dropdowns and Inputs -->
            <div id="item-creator-inputs">
            <div class="input-group">
                <select id="selectRarity" class="dropdown" style="width:100%;">
                <option value="default">Rareza</option>
                <option value="special">Especial</option>
                <option value="magical">Mágico</option>
                <option value="epic">Épico</option>
                <option value="legendary">Legendario</option>
                </select>
            </div>
            <div class="input-group">
                <select id="selectMaterial" class="dropdown" style="width:100%;">
                    <option value="">Material</option>
                    <option value="hierro">Hierro</option>
                    <option value="acero">Acero</option>
                    <option value="aceroFino">Acero fino</option>
                    <option value="aleacion">Aleación de acero</option>
                    <option value="xyme">Xymerald</option>
                </select>
            </div>
            
            <div class="input-group">
                <select id="selectQual" class="dropdown" style="width:100%;">
                    <option value="">Calidad</option>
                    <option value="normal">Normal</option>
                    <option value="mejorado">Mejorado</option>
                    <option value="superior">Superior</option>
                    <option value="gran">Gran</option>
                    <option value="maestre">Maestre</option>
                </select>
            </div>

            <div class="input-group">
                <p>Nivel</p>
                <input type="text" id="selectLvl" />
            </div>

            <div class="input-group">
                <p>Bonus de daño</p>
                <input type="text" id="selectBonusDmg" />
            </div>

            <div class="input-group">
                <p>Chance de crítico</p>
                <input type="text" id="selectCrit" />
            </div>

            <div class="input-group">
                <select id="selectFisDmg" class="dropdown" style="width:100%;">
                    <option value="">Elige el daño físico</option>
                    <option value="punzante">Punzante</option>
                    <option value="cortante">Cortante</option>
                    <option value="aplastante">Aplastante</option>
                </select>
                <input type="text" id="selectFisDmgNum" />
            </div>

            <div class="input-group">
                <select id="selectMagDmg" class="dropdown" style="width:100%;">
                    <option value="">Elige el daño mágico</option>
                    <option value="fuego">Fuego</option>
                    <option value="elec">Electricidad</option>
                    <option value="hielo">Hielo</option>
                </select>
                <input type="text" id="selectMagDmgNum" />
            </div>

            <div class="input-group">
                <select id="selectBonus2" class="dropdown" style="width:100%;">
                    <option value="">Bonus extra 1</option>
                    <option value="velocidadataque">Velocidad de ataque</option>
                    <option value="velocidadinvocacion">Velocidad de invocación</option>
                    <option value="fuerza">Fuerza</option>
                    <option value="constitucion">Constitución</option>
                    <option value="concentracion">Concentración</option>
                    <option value="inteligencia">Inteligencia</option>
                    <option value="destreza">Destreza</option>
                    <option value="chancecritico">Chance de crítico</option>
                    <option value="dmgcritico">Daño crítico</option>
                    <option value="atributoclase">Atributo de clase</option>
                </select>
                <input type="text" id="selectBonus2Num" />
            </div>

            <div class="input-group">
                <select id="selectBonus3" class="dropdown" style="width:100%;">
                    <option value="">Bonus extra 2</option>
                    <option value="velocidadataque">Velocidad de ataque</option>
                    <option value="velocidadinvocacion">Velocidad de invocación</option>
                    <option value="fuerza">Fuerza</option>
                    <option value="constitucion">Constitución</option>
                    <option value="concentracion">Concentración</option>
                    <option value="inteligencia">Inteligencia</option>
                    <option value="destreza">Destreza</option>
                    <option value="chancecritico">Chance de crítico</option>
                    <option value="dmgcritico">Daño crítico</option>
                    <option value="atributoclase">Atributo de clase</option>
                </select>
                <input type="text" id="selectBonus3Num" />
            </div>

            <div class="input-group">
                <select id="selectGem" class="dropdown" style="width:100%;">
                    <option value="">Gema</option>
                    <option value="vacia">Muesca vacia</option>
                    <option value="elec">Daño electrico</option>
                    <option value="fuego">Daño de fuego</option>
                    <option value="hielo">Daño de hielo</option>
                    <option value="cortante">Daño cortante</option>
                    <option value="punzante">Daño punzante</option>
                    <option value="aplas">Daño aplastante</option>
                    <option value="crit">Chance de crítico</option>
                    <option value="velatq">Velocidad de ataque</option>
                    <option value="velinv">Velocidad de invocación</option>
                </select>
                <input type="text" id="selectGemDmgNum" />
            </div>
            </div>
        </div>
    </div>  
    <button id="item-check">¿myNewItem?</button>
    <script type="module" src="main.js"></script>
</body>
</html>
