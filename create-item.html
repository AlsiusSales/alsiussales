<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Ítem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div style="display: flex; flex-direction: row;">
        <!-- Select Item -->
        <div class="select-sim" id="select-item">
            <div class="options">
                <div class="option">
                    <input type="radio" name="item" value="" id="item-" checked />
                    <label for="item-">
                        <img src="" alt="" /> ¿Qué quieres vender?
                    </label>
                </div>
                <div class="option">
                    <input type="radio" name="item" value="espada-caballero-elite" id="item-espada-caballero-elite" />
                    <label for="item-espada-caballero-elite">
                        <img src="thumbs/weapons/72358-Icon item weapon sword01.png" alt="" height="40" width="40" /> Espada de caballero elite
                    </label>
                </div>
                <div class="option">
                    <input type="radio" name="item" value="lanza-caballero-elite" id="item-lanza-caballero-elite" />
                    <label for="item-lanza-caballero-elite">
                        <img src="thumbs/weapons/72360-Icon item weapon spear01.png" alt="" height="40" width="40" /> Lanza de caballero elite
                    </label>
                </div>
                <div class="option">
                    <input type="radio" name="item" value="hacha-caballero-elite" id="item-hacha-caballero-elite" />
                    <label for="item-hacha-caballero-elite">
                        <img src="thumbs/weapons/72367-Icon item weapon axe01.png" alt="" height="40" width="40" /> Hacha de caballero elite
                    </label>
                </div>
                <div class="option">
                    <input type="radio" name="item" value="martillo-caballero-elite" id="item-martillo-caballero-elite" />
                    <label for="item-martillo-caballero-elite">
                        <img src="thumbs/weapons/72365-Icon item weapon hammer02.png" alt="" height="40" width="40" /> Martillo de caballero elite
                    </label>
                </div>
            </div>
        </div>

        <!-- Item Template -->
        <div>
            <div id="item-template"></div>
            <button id="item-check">¿Item?</button>
        </div>

        <!-- Dropdowns and Inputs -->
        <div>
            <select id="selectRarity" class="dropdown">
                <option value="default">Rareza</option>
                <option value="especial">Especial</option>
                <option value="magico">Mágico</option>
                <option value="epico">Épico</option>
                <option value="legendario">Legendario</option>
            </select>

            <select id="selectMaterial" class="dropdown">
                <option value="">Material</option>
                <option value="hierro">Hierro</option>
                <option value="acero">Acero</option>
                <option value="aceroFino">Acero fino</option>
                <option value="aleacion">Aleación de acero</option>
                <option value="xyme">Xymerald</option>
            </select>

            <select id="selectQual" class="dropdown">
                <option value="">Calidad</option>
                <option value="normal">Normal</option>
                <option value="mejorado">Mejorado</option>
                <option value="superior">Superior</option>
                <option value="gran">Gran</option>
                <option value="maestre">Maestre</option>
            </select>

            <div class="input-group">
                <p>Nivel</p>
                <input type="text" id="selectLvl" />
            </div>

            <div class="input-group">
                <p>Bonus de daño</p>
                <input type="text" id="selectBonusDmg" />
            </div>

            <div class="input-group">
                <p>Chance de crítico</p>
                <input type="text" id="selectCrit" />
            </div>

            <div class="input-group">
                <p>Daño físico</p>
                <select id="selectFisDmg" class="dropdown">
                    <option value="">Elige el daño físico</option>
                    <option value="punzante">Punzante</option>
                    <option value="cortante">Cortante</option>
                    <option value="aplastante">Aplastante</option>
                </select>
                <input type="text" id="selectFisDmgNum" />
            </div>

            <div class="input-group">
                <p>Daño mágico</p>
                <select id="selectMagDmg" class="dropdown">
                    <option value="">Elige el daño mágico</option>
                    <option value="fuego">Fuego</option>
                    <option value="elec">Electricidad</option>
                    <option value="hielo">Hielo</option>
                </select>
                <input type="text" id="selectMagDmgNum" />
            </div>

            <div class="input-group">
                <p>Bonus extra 1</p>
                <select id="selectBonus2" class="dropdown">
                    <option value="">Bonus extra 1</option>
                    <option value="velocidadataque">Velocidad de ataque</option>
                    <option value="velocidadinvocacion">Velocidad de invocación</option>
                    <option value="fuerza">Fuerza</option>
                    <option value="constitucion">Constitución</option>
                    <option value="concentracion">Concentración</option>
                    <option value="inteligencia">Inteligencia</option>
                    <option value="destreza">Destreza</option>
                    <option value="chancecritico">Chance de crítico</option>
                    <option value="dmgcritico">Daño crítico</option>
                    <option value="atributoclase">Atributo de clase</option>
                </select>
                <input type="text" id="selectBonus2Num" />
            </div>

            <div class="input-group">
                <p>Bonus extra 2</p>
                <select id="selectBonus3" class="dropdown">
                    <option value="">Bonus extra 2</option>
                    <option value="velocidadataque">Velocidad de ataque</option>
                    <option value="velocidadinvocacion">Velocidad de invocación</option>
                    <option value="fuerza">Fuerza</option>
                    <option value="constitucion">Constitución</option>
                    <option value="concentracion">Concentración</option>
                    <option value="inteligencia">Inteligencia</option>
                    <option value="destreza">Destreza</option>
                    <option value="chancecritico">Chance de crítico</option>
                    <option value="dmgcritico">Daño crítico</option>
                    <option value="atributoclase">Atributo de clase</option>
                </select>
                <input type="text" id="selectBonus3Num" />
            </div>

            <div class="input-group">
                <p>Gema</p>
                <select id="selectGem" class="dropdown">
                    <option value="">Gema</option>
                    <option value="vacia">Muesca vacia</option>
                    <option value="elec">Daño electrico</option>
                    <option value="fuego">Daño de fuego</option>
                    <option value="hielo">Daño de hielo</option>
                    <option value="cortante">Daño cortante</option>
                    <option value="punzante">Daño punzante</option>
                    <option value="aplas">Daño aplastante</option>
                    <option value="crit">Chance de crítico</option>
                </select>
                <input type="text" id="selectGemDmgNum" />
            </div>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
